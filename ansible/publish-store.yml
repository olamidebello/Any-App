---
- name: Publish verified AnyApps Android listing to existing Africa Apps Store
  hosts: all
  become: true
  vars:
    anyapps_root: /opt/anyapps/repo
  tasks:
    - name: Install checksum-verified Android download
      ansible.builtin.command:
        argv: [python3, '{{ anyapps_root }}/scripts/install-apk.py']
      changed_when: true
    - name: Register existing catalog entry and verify public listing
      ansible.builtin.command:
        argv: [python3, '{{ anyapps_root }}/scripts/publish-store.py']
      changed_when: true
