plugins { id 'com.android.application' }
android {
    namespace 'com.olamidepanel.anyapps'
    compileSdk 35
    defaultConfig {
        applicationId 'com.olamidepanel.anyapps'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName '1.0.0'
    }
    buildTypes { debug { applicationIdSuffix '.dev' }; release { minifyEnabled false } }
}
